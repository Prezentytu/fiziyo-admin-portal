name: Intake zgłoszeń do agenta

# An optional hint to read-only intake, never an authorization or worker launch.
on:
  issues:
    types: [opened, labeled]
permissions:
  contents: read
concurrency:
  group: intake-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  wake-intake:
    if: >-
      vars.AGENT_INTAKE_ENABLED == 'true' &&
      ((github.event.action == 'labeled' &&
        contains(fromJSON('["bot-finding", "from-przemek"]'), github.event.label.name)) ||
       (github.event.action == 'opened' &&
        (contains(github.event.issue.labels.*.name, 'bot-finding') ||
         contains(github.event.issue.labels.*.name, 'from-przemek'))))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Przekaż wskaźnik do kwalifikacji
        env:
          WEBHOOK_URL: ${{ secrets.CURSOR_INTAKE_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.CURSOR_INTAKE_WEBHOOK_KEY }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL}" ] || [ -z "${WEBHOOK_KEY}" ]; then
            echo '::error::Brak konfiguracji intake.'
            exit 1
          fi
          case "$WEBHOOK_URL" in https://*) ;; *) exit 1 ;; esac
          payload=$(jq -n --arg repository "$REPOSITORY" --argjson issue "$ISSUE_NUMBER" \
            '{repository: $repository, issue: $issue}')
          # Never log response bodies, follow redirects, or retry ambiguous delivery.
          curl --silent --show-error --fail --max-time 30 --proto '=https' \
            --output /dev/null --request POST "$WEBHOOK_URL" \
            --header "Authorization: Bearer ${WEBHOOK_KEY}" \
            --header 'Content-Type: application/json' --data "$payload"
