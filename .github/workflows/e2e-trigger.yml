name: Trigger E2E Tests

on:
  deployment_status:

permissions:
  contents: read
  statuses: write

jobs:
  trigger-e2e:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4

      - name: Resolve E2E scope
        id: scope
        env:
          DEPLOYMENT_JSON: ${{ toJSON(github.event) }}
        run: node scripts/e2e-dispatch.mjs resolve

      - name: Skip generic preview
        if: steps.scope.outputs.action == 'skip'
        run: |
          echo "Pomijam E2E dla ${{ steps.scope.outputs.reason }}."
          echo "Preview nie publikuje E2E Preview Smoke i nie bije w shared DEV."

      - name: Dispatch fiziyo-tests
        if: steps.scope.outputs.action == 'dispatch'
        env:
          DEPLOYMENT_JSON: ${{ toJSON(github.event) }}
          E2E_DISPATCH_PAT: ${{ secrets.E2E_DISPATCH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
          TESTS_REPO_OWNER: ${{ vars.E2E_TESTS_REPO_OWNER }}
          TESTS_REPO_NAME: ${{ vars.E2E_TESTS_REPO_NAME }}
          EVENT_TYPE: ${{ steps.scope.outputs.event_type }}
          PROJECT: ${{ steps.scope.outputs.project }}
          BASE_URL: ${{ steps.scope.outputs.base_url }}
          STATUS_CONTEXT: ${{ steps.scope.outputs.status_context }}
        run: node scripts/e2e-dispatch.mjs dispatch
