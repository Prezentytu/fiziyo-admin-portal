name: Trigger E2E Tests

on:
  deployment_status:

permissions:
  contents: read

jobs:
  trigger-e2e:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify deployment and dispatch scoped E2E
        uses: actions/github-script@v7
        env:
          TESTS_REPO_OWNER: ${{ vars.E2E_TESTS_REPO_OWNER }}
          TESTS_REPO_NAME: ${{ vars.E2E_TESTS_REPO_NAME }}
        with:
          github-token: ${{ secrets.E2E_DISPATCH_PAT }}
          script: |
            try {
              const owner = process.env.TESTS_REPO_OWNER || 'Prezentytu';
              const repo = process.env.TESTS_REPO_NAME || 'fiziyo-tests';
              if (owner !== 'Prezentytu' || repo !== 'fiziyo-tests' || context.repo.owner !== 'Prezentytu' || context.repo.repo !== 'fiziyo-admin-portal') {
                throw new Error();
              }
              const status = context.payload.deployment_status;
              const sha = context.payload.deployment?.sha;
              if (status?.state !== 'success' || !/^[0-9a-f]{40}$/.test(sha || '')) throw new Error();
              const target = status.environment_url || status.target_url || '';
              const devUrls = ['https://devportal.fiziyo.pl', 'https://dev.portal.fiziyo.pl'];
              const prod = target === 'https://portal.fiziyo.pl' || status.environment === 'Production';
              const dev = devUrls.includes(target) || status.environment === 'Development';
              if (!prod && !dev) {
                core.notice('Preview is not certified against shared DEV. Run dedicated DEV evidence explicitly.');
                return;
              }
              if ((prod && devUrls.includes(target)) || (dev && target === 'https://portal.fiziyo.pl')) throw new Error();
              const baseUrl = prod ? 'https://portal.fiziyo.pl' : devUrls.includes(target) ? target : devUrls[0];
              const apiUrl = prod ? 'https://fiziyo-prod.azurewebsites.net' : 'https://fizjo-app-api.azurewebsites.net';
              const response = await fetch(`${baseUrl}/sign-in`, { method: 'HEAD', redirect: 'error', cache: 'no-store', signal: AbortSignal.timeout(20000) });
              if (!response.ok || response.headers.get('x-fiziyo-release-schema') !== '1' || response.headers.get('x-fiziyo-admin-sha') !== sha || response.headers.get('x-fiziyo-api-origin') !== apiUrl || !/^dpl_[A-Za-z0-9]{8,80}$/.test(response.headers.get('x-fiziyo-deployment-id') || '')) throw new Error();
              const payload = { base_url: baseUrl, sha, project: prod ? 'prod-safe' : 'all', admin_owner: 'Prezentytu', admin_repo: 'fiziyo-admin-portal' };
              if (!prod) {
                const health = await fetch(`${apiUrl}/health/live`, { redirect: 'error', cache: 'no-store', signal: AbortSignal.timeout(20000) });
                if (!health.ok) throw new Error();
                const body = await health.json();
                if (!/^[0-9a-f]{40}$/.test(body.version || '')) throw new Error();
                payload.api_sha = body.version;
              }
              await github.rest.repos.createDispatchEvent({ owner, repo, event_type: prod ? 'e2e-prod-run' : 'e2e-dev-run', client_payload: payload });
            } catch {
              core.setFailed('Deployment identity or E2E dispatch failed. No release evidence was certified.');
            }
