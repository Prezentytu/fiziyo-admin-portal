name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # Ostatnie przebiegi trwają 3-5 min; limit ~3x zapasu zamiast domyślnych 360 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Skills lint
        run: npm run skills:lint

      - name: Agent adapter
        run: npm run agent:check

      - name: Agent script tests
        run: npm run agent:test

      - name: Lint
        run: npm run lint

      - name: Data-testid guard
        run: npm run check:testids

      # Baza długu może tylko maleć: nowy hex albo paleta Tailwinda poza tokenami blokuje PR (AGENTS.md, Validation Commands).
      - name: Design tokens guard
        run: npm run check:design-tokens

      # Schemat backendu to zacommitowany SDL w prywatnym fizjo-app (jego CI pilnuje, że jest aktualny). Operacja panelu
      # spoza schematu czerwieni PR, zanim zobaczy ją użytkownik. Token musi mieć contents:read do Prezentytu/fizjo-app.
      - name: Backend GraphQL schema
        uses: actions/checkout@v7
        with:
          repository: Prezentytu/fizjo-app
          token: ${{ secrets.E2E_DISPATCH_PAT }}
          sparse-checkout: backend/schema.graphql
          sparse-checkout-cone-mode: false
          path: .backend-schema

      - name: GraphQL documents vs backend schema
        run: npm run graphql:validate
        env:
          GRAPHQL_SCHEMA_PATH: .backend-schema/backend/schema.graphql

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test -- --run

      # Build w PR wykonuje kod z gałęzi (także pisany przez agentów), więc nie dostaje sekretu Clerk. Klucz publiczny
      # wystarcza do builda; sekret jest potrzebny dopiero w działającej aplikacji (Vercel), nie w CI.
      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: true
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
