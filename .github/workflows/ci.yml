name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Skills lint
        run: npm run skills:lint

      - name: Agent adapter
        run: npm run agent:check

      - name: Agent script tests
        run: npm run agent:test

      - name: Lint
        run: npm run lint

      - name: Data-testid guard
        run: npm run check:testids

      # Baza długu może tylko maleć: nowy hex albo paleta Tailwinda poza tokenami blokuje PR (AGENTS.md, Validation Commands).
      - name: Design tokens guard
        run: npm run check:design-tokens

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test -- --run

      # Build w PR wykonuje kod z gałęzi (także pisany przez agentów), więc nie dostaje sekretu Clerk. Klucz publiczny
      # wystarcza do builda; sekret jest potrzebny dopiero w działającej aplikacji (Vercel), nie w CI.
      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: true
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
