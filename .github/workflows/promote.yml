# Promote admin: przypina istniejący Vercel deployment do Production bez rebuildu.
name: Promote admin

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: "Vercel deployment ID albo URL już przetestowany na DEV"
        required: true
        type: string
      override_reason:
        description: "Wymagane tylko gdy E2E Dev Full jest czerwone lub nieaktualne"
        required: false
        type: string

permissions:
  contents: read

jobs:
  promote:
    name: Promote Vercel deployment
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://portal.fiziyo.pl
    steps:
      - name: Require main
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Promote admin odpalaj z gałęzi main."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Preflight
        env:
          OVERRIDE_REASON: ${{ inputs.override_reason }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          echo "### Promote admin" >> "$GITHUB_STEP_SUMMARY"
          echo "- deployment: \`$DEPLOYMENT_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- sha: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$OVERRIDE_REASON" ]]; then
            echo "- break-glass: \`$OVERRIDE_REASON\` (aktor: ${{ github.actor }})" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Promote without rebuild
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "::error::Brak VERCEL_TOKEN. Promote ręcznie: vercel promote <deployment-id>"
            exit 1
          fi
          npx --yes vercel@41 promote "$DEPLOYMENT_ID" --yes --token "$VERCEL_TOKEN"

      - name: Dispatch prod-safe E2E
        env:
          E2E_DISPATCH_PAT: ${{ secrets.E2E_DISPATCH_PAT }}
          TESTS_OWNER: ${{ vars.E2E_TESTS_REPO_OWNER || github.repository_owner }}
          TESTS_REPO: ${{ vars.E2E_TESTS_REPO_NAME || 'fiziyo-tests' }}
        run: |
          if [[ -z "$E2E_DISPATCH_PAT" ]]; then
            echo "::warning::Brak E2E_DISPATCH_PAT — pomijam prod-safe dispatch."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $E2E_DISPATCH_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TESTS_OWNER}/${TESTS_REPO}/dispatches" \
            -d "{\"event_type\":\"e2e-prod-run\",\"client_payload\":{\"base_url\":\"https://portal.fiziyo.pl\",\"project\":\"prod-safe\",\"sha\":\"${GITHUB_SHA}\",\"admin_owner\":\"${{ github.repository_owner }}\",\"admin_repo\":\"fiziyo-admin-portal\"}}"
