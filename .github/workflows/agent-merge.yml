# Sędzia merge'u agenta: po zakończeniu CI albo Claude review ocenia otwarte PR-y do main i merguje
# najwyżej jeden, który spełnia wszystkie warunki z `.github/agent-merge/` (zielony gate, PASS Claude
# review dla heada, tylko dozwolone ścieżki, limit rozmiaru, drzwi dwukierunkowe, czysty main).
# workflow_run i schedule biegną z definicji z gałęzi domyślnej, więc PR nie przepisze własnego sędziego.
# Wyłącznik: zmienna repo AGENT_MERGE=off (Settings → Secrets and variables → Actions → Variables).
# Zatrzymanie jednego PR: etykieta `hold`.
# Polityka: https://github.com/Prezentytu/baza-wiedzy/blob/main/praca-z-agentami/model-pracy/auto-merge-2026-11-19.md
name: Agent merge

on:
  workflow_run:
    workflows: ['CI', 'Claude review']
    types: [completed]
  schedule:
    - cron: '*/30 6-22 * * *'
  workflow_dispatch:

# Jeden sędzia na repo naraz, bez przerywania: merge'e idą szeregowo.
concurrency:
  group: agent-merge
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read

jobs:
  sedzia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/agent-merge
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Testy reguł
        run: node --test .github/agent-merge/reguly.test.mjs
      - name: Sędzia
        env:
          GH_TOKEN: ${{ github.token }}
          # Aplikacja GitHub, gdy jest skonfigurowana: merge widać jako bota i push na main uruchamia
          # workflowy. Bez niej merge idzie na GITHUB_TOKEN (workflowy `push` po merge'u wtedy nie startują).
          AGENT_MERGE_APP_ID: ${{ vars.AGENT_MERGE_APP_ID }}
          AGENT_MERGE_APP_KEY: ${{ secrets.AGENT_MERGE_APP_KEY }}
          AGENT_MERGE: ${{ vars.AGENT_MERGE }}
        run: node .github/agent-merge/sedzia.mjs
