name: Pin DEV portal to main

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pin-devportal
  cancel-in-progress: false

jobs:
  # Vercel zapisuje w deployment.ref SHA, a github.ref jest wtedy puste, więc żadne z nich nie podaje gałęzi.
  # Bramka bez sekretów sprawdza w API, czy wdrożony commit jest w main (jak e2e-trigger.yml).
  czy-main:
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      w-main: ${{ steps.porownanie.outputs.w-main }}
    steps:
      - id: porownanie
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "w-main=false" >> "$GITHUB_OUTPUT"; exit 0; }
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SHA}...main" --jq .status)
          if [[ "$status" == "ahead" || "$status" == "identical" ]]; then w=true; else w=false; fi
          echo "compare ${SHA:0:7}...main: $status"
          echo "w-main=$w" >> "$GITHUB_OUTPUT"

  pin:
    needs: czy-main
    # Tylko wdrożenia z main: preview innych gałęzi (np. skrzynka/*) nie uruchamiają kroku z tokenem Vercel.
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.czy-main.outputs.w-main == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # deployment_status checkoutuje domyślnie commit wdrożenia (także preview gałęzi skrzynka/* z kodem modelu);
      # skrypt z tokenem Vercel zawsze z main.
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Point devportal.fiziyo.pl at main Preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME }}
          DEPLOYMENT_REF: ${{ github.event.deployment.ref || 'main' }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha || github.sha }}
          DEPLOYMENT_ENV: ${{ github.event.deployment_status.environment || '' }}
        run: node scripts/pin-devportal-domain.mjs
