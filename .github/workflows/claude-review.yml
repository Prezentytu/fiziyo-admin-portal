# Review każdego PR przez Claude Code (plugin code-review), drugi recenzent obok Cursora.
# Rozliczenie: subskrypcja Claude przez CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`).
# Wymaga aplikacji GitHub "Claude" zainstalowanej na repo (id-token: write).
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PR-y od agentów (Skrzynka, Cursor) też dostają review.
          allowed_bots: "prezentytu-skrzynka-internal,cursor"
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--model claude-sonnet-5-5 --effort medium --allowedTools "mcp__github_inline_comment__create_inline_comment"'
