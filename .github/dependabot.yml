version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    ignore:
      # Typy idą za runtime: CI i Vercel jadą na Node 24 (ci.yml, node-version).
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # typescript-eslint z eslint-config-next obsługuje TypeScript <6.1 (peer); 7.x wysypuje lint przy ładowaniu konfiguracji.
      - dependency-name: typescript
        versions:
          - ">=6.1"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      major:
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - ci
    groups:
      github-actions:
        patterns:
          - "*"
